version: "3.8"
services:
  redis:
    image: redis
    container_name: redis
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oasfi-api
    ports:
      - "4000:3000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
